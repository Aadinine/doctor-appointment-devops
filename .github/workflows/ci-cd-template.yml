# CI/CD Pipeline (saved as template - needs GitHub secrets setup)
# To activate: rename to ci-cd.yml and set up GitHub secrets

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  ACR_NAME: doctorappregistry
  AKS_CLUSTER: doctor-app-aks
  RESOURCE_GROUP: doctor-app-rg

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install -r app/requirements.txt
        pip install pytest
    
    - name: Run tests
      run: |
        # Add your tests here
        python -m pytest tests/ || true
    
    - name: Build Docker image
      run: |
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/doctor-app:${{ github.sha }} -f docker/Dockerfile .
    
    - name: Login to ACR
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Push to ACR
      run: |
        docker push ${{ env.ACR_NAME }}.azurecr.io/doctor-app:${{ github.sha }}
        docker tag ${{ env.ACR_NAME }}.azurecr.io/doctor-app:${{ github.sha }} ${{ env.ACR_NAME }}.azurecr.io/doctor-app:latest
        docker push ${{ env.ACR_NAME }}.azurecr.io/doctor-app:latest
  
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER }}
    
    - name: Update deployment image
      run: |
        kubectl set image deployment/doctor-app doctor-app=${{ env.ACR_NAME }}.azurecr.io/doctor-app:${{ github.sha }} --record
    
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/doctor-app
        kubectl get pods
        kubectl get svc
